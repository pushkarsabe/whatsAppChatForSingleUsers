                <ul class="modal-contacts-list" id="fixed-contacts-list">
                    <li class="new-group-item">
                        <div class="contact-avatar new-group-icon">👤</div>
                        <div class="contact-name-info">
                            <div class="name">New contact</div>
                        </div>
                    </li>
                </ul>
                <ul class="modal-contacts-list dynamic-list" id="dynamic-contacts-list">
                </ul>
            </div>

            <div class="new-chat-modal request-modal" id="notification-modal">
                <div class="modal-header">Chat Requests</div>
                <ul class="modal-contacts-list" id="requests-list">
                    <li>No new requests.</li>
                </ul>
            </div>

            <div class="search-bar">
                <input type="text" placeholder="Search or start a new chat">
            </div>

            <div class="chats-list" id="friends-chats-list">
                <div class="empty-chat-placeholder">Loading chats...</div>
            </div>
        </div>

        <div class="main-content" id="main-chat-content">
            <header class="chat-header" id="chat-header-default">
                <div class="contact-info">
                    <div class="contact-avatar-placeholder"></div>

                            alt="More Options" /></button>
                </div>
            </header>

            <div id="chat-window-container">
                <div class="chat-messages" id="chat-messages">
                    <div class="message sent">Welcome to the chat! Select a friend to start.</div>
                </div>

                <div class="message-input-area" id="message-input-area">
                    <button class="emoji-button">😊</button>
                    <input type="text" placeholder="Type a message" id="message-input">
                    <button class="send-button" id="send-message-btn">▶️</button>
                </div>
            </div>
        </div>
